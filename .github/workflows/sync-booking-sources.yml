name: Sync Booking Sources with AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1' # 每週一自動執行

jobs:
  run-ai-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js @google/genai dotenv

      - name: Run AI Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 👈 請在 GitHub Secrets 填入 Gemini API 金鑰
        run: node scripts/sync_booking_sources.js
