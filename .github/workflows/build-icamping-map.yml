name: Build iCamping Map & Sync IDs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  run-sync-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🎯 加上 ws 套件安裝
      - name: Install Required Dependencies
        run: npm install @supabase/supabase-js dotenv ws

      - name: Run build_icamping_map.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build_icamping_map.js
        
