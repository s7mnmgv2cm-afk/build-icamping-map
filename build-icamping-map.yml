name: Build iCamping Map & Sync IDs

on:
  # 1. 支援手動在 GitHub 網頁上點擊按鈕觸發
  workflow_dispatch:
  
  # 2. 設定定期自動執行 (例如每週一早上 8 點執行一次)
  schedule:
    - cron: '0 0 * * 1'

jobs:
  run-sync-script:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安裝依賴套件
      - name: Install Dependencies
        run: npm ci

      # 4. 執行預建腳本 (環境變數從 GitHub Secrets 注入)
      - name: Run build_icamping_map.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build_icamping_map.js
